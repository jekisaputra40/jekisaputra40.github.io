<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toko Online Sederhana</title>
  <style>
   
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #333;
    }

    
    header {
      background: #111;
      color: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    nav a {
      color: #fff;
      margin-left: 15px;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* ===== CONTAINER ===== */
    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    /* ===== PRODUK ===== */
    .produk-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .produk {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .produk img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }

    .produk h3 {
      margin: 10px 0 5px;
      font-size: 16px;
    }

    .produk p {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .harga {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .produk button {
      margin-top: auto;
      padding: 10px;
      border: none;
      background: #0d6efd;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .produk button:hover {
      background: #0b5ed7;
    }

    /* ===== KERANJANG ===== */
    .cart {
      margin-top: 40px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .cart h2 {
      margin-bottom: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      background: #111;
      color: #fff;
      font-size: 13px;
    }
  </style>
</head>
<body>

  
  <header>
    <h1>TokoKu</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Produk</a>
      <a href="#">Kontak</a>
    </nav>
  </header>

 
  <div class="container">
    <h2>Daftar Produk</h2>
    <br />

    <div class="produk-list" id="produkList">
      
    </div>

    
    <div class="cart">
      <h2>Keranjang</h2>
      <div id="cartItems"></div>
      <div class="total" id="totalHarga">Total: Rp 0</div>
    </div>
  </div>

  <footer>
    © 2025 TokoKu - Template Toko Online
  </footer>

  <script>
    // ===== DATA PRODUK =====
    const produk = [
      { id: 1, nama: "Kaos Hitam", harga: 200000, img: "https://via.placeholder.com/300x200" },
      { id: 2, nama: "vapor. centaurus.", harga: 800000, img: "https://jekisaputra40.github.io/blackjack/RYUS.jpg" },
      { id: 3, nama: "Topi Keren", harga: 100000, img: "https://via.placeholder.com/300x200" },
      { id: 4, nama: "Jaket Hoodie", harga: 6000000, img: "https://via.placeholder.com/300x200" }
    ];

    let cart = [];

    const produkList = document.getElementById("produkList");
    const cartItems = document.getElementById("cartItems");
    const totalHarga = document.getElementById("totalHarga");

    
    produk.forEach(item => {
      const div = document.createElement("div");
      div.className = "produk";
      div.innerHTML = `
        <img src="${item.img}" alt="${item.nama}">
        <h3>${item.nama}</h3>
        <p class="harga">Rp ${item.harga.toLocaleString()}</p>
        <button onclick="tambahKeCart(${item.id})">Tambah ke Keranjang</button>
      `;
      produkList.appendChild(div);
    });

    
    function tambahKeCart(id) {
      const item = produk.find(p => p.id === id);
      cart.push(item);
      renderCart();
    }

    
    function renderCart() {
      cartItems.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        total += item.harga;
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <span>${item.nama}</span>
          <span>Rp ${item.harga.toLocaleString()}</span>
        `;
        cartItems.appendChild(div);
      });

      totalHarga.innerText = "Total: Rp " + total.toLocaleString();
    }
  </script>

</body>
</html>
